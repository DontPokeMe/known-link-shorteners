# Weekly maintenance: discover new candidate domains, liveness-check the active
# datasets, triage new candidates with a local Ollama model, re-sort and dedupe,
# then commit changes to main and open a PR for anything a human must decide.
#
# Ollama on the runner:
#   * A self-hosted runner that already has Ollama running short-circuits the
#     install: the "Detect local Ollama" step probes OLLAMA_HOST, then
#     http://host.docker.internal:11434 (containerised runner), then
#     http://localhost:11434, and if any answers we use it as-is. Set OLLAMA_HOST
#     repo-wide as an Actions variable (Settings > Variables) or per-run below.
#   * A GitHub-hosted ubuntu-latest runner has no Ollama, so the job installs it,
#     starts it and pulls CI_OLLAMA_MODEL. The model blobs are cached between
#     runs, but a cache miss just means a slower (multi-GB) download, not a
#     failure. The whole install block is BEST EFFORT: if anything in it breaks
#     we log a warning and continue with --no-ollama. Keeping the dataset
#     liveness data fresh matters more than triaging new candidates.
#
# Model choice is deliberate: CI_OLLAMA_MODEL must stay at 7B parameters or
# larger. A measured benchmark of this classification task scored 3B models at
# 6/10 and they invented false positives, which is worse than no triage at all
# (maintain_shorteners.py enforces the same floor via --min-params).
#
# See the "Automation & Obsidian Workflow" section of README.md.
name: Weekly maintenance

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      runs_on:
        description: "Runner label (use self-hosted for Ollama triage)"
        type: choice
        options: ["ubuntu-latest", "self-hosted"]
        default: "ubuntu-latest"
      ollama_host:
        description: "Ollama base URL (blank = repo variable or localhost)"
        type: string
        default: ""
      model:
        description: "Force a model (blank = CI_OLLAMA_MODEL, or auto-discover on a self-hosted Ollama)"
        type: string
        default: ""
      dry_run:
        description: "Report only, do not write or commit"
        type: boolean
        default: false
      skip_check:
        description: "Skip the liveness check (triage + normalise only)"
        type: boolean
        default: false
      skip_llm:
        description: "Force --no-ollama (no install, no triage)"
        type: boolean
        default: false
      skip_discovery:
        description: "Skip the upstream candidate discovery pass"
        type: boolean
        default: false
      limit:
        description: "Probe only the first N domains (0 = all)"
        type: string
        default: "0"

permissions:
  contents: write
  # create-pull-request needs this for the review queue PR (step 3 below).
  pull-requests: write

# Serialised against the monthly release, which writes the same data files via
# scripts/probe_domains.py. Both workflows must carry this same group -- the 1st
# of the month can fall on a Sunday and collide with this cron.
concurrency:
  group: dataset-write
  cancel-in-progress: false

# Change the triage model HERE and nowhere else: the cache key, the pull and the
# run all read it. qwen2.5:7b is ~4.7GB. See the note in the header before
# swapping it for anything smaller.
env:
  CI_OLLAMA_MODEL: "qwen2.5:7b"

jobs:
  maintain:
    runs-on: ${{ inputs.runs_on || 'ubuntu-latest' }}
    # Generous: a cold model cache adds a multi-GB pull, and 7B triage runs on
    # CPU on a hosted runner. The liveness probe itself is the fast part.
    timeout-minutes: 120
    env:
      OLLAMA_HOST: ${{ inputs.ollama_host || vars.OLLAMA_HOST || 'http://localhost:11434' }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # create-pull-request wants real history to diff the review branch
          # against; a depth-1 clone makes it re-create the branch every run.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jsonschema

      - name: Validate data (pre-run)
        run: python scripts/validate_data.py

      # One workflow for both runner types. This runs FIRST so a self-hosted
      # runner with its own Ollama skips the install/pull steps entirely.
      - name: Detect local Ollama
        id: ollama
        run: |
          HOSTS="${OLLAMA_HOST} http://host.docker.internal:11434 http://localhost:11434"
          for H in $HOSTS; do
            if curl -sf -m 5 "$H/api/tags" -o /tmp/ollama-tags.json; then
              echo "Ollama reachable at $H"
              python3 -c "import json;print('Installed models:', ', '.join(m.get('name','?') for m in json.load(open('/tmp/ollama-tags.json')).get('models', [])) or '(none)')"
              echo "available=true" >> $GITHUB_OUTPUT
              echo "host=$H" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          echo "No Ollama reachable (tried: $HOSTS) -- this job will install its own."
          echo "available=false" >> $GITHUB_OUTPUT
          echo "host=" >> $GITHUB_OUTPUT

      # Multi-GB blobs. A miss is slow, never fatal -- the pull below just
      # re-downloads. Keyed on the model so a model swap invalidates cleanly.
      - name: Restore Ollama model cache
        if: ${{ steps.ollama.outputs.available != 'true' && inputs.skip_llm != true }}
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ runner.os }}-${{ inputs.model || env.CI_OLLAMA_MODEL }}

      # BEST EFFORT. Every failure path here warns and exits 0 with ready=false;
      # the job then runs with --no-ollama rather than losing the week's
      # liveness data. Nothing below this line may `exit 1`.
      - name: Install and start Ollama
        id: ollama_setup
        if: ${{ steps.ollama.outputs.available != 'true' && inputs.skip_llm != true }}
        env:
          # Ignore the job-level OLLAMA_HOST here: this is the server we are
          # about to bind, and a stale/remote value would make `serve` fail.
          OLLAMA_HOST: "http://127.0.0.1:11434"
          CI_MODEL: ${{ inputs.model || env.CI_OLLAMA_MODEL }}
        run: |
          set +e
          SERVE_LOG="${RUNNER_TEMP:-/tmp}/ollama-serve.log"

          bail() {
            echo "::warning::$1 Continuing with LLM triage disabled (--no-ollama)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "$CI_MODEL" ]; then
            bail "No model name resolved (CI_OLLAMA_MODEL is empty)."
          fi

          # Keep blobs where the cache step looks for them. The install script
          # also registers a systemd unit running as the 'ollama' user, whose
          # model dir is elsewhere -- stop it so our own server owns the port.
          export OLLAMA_MODELS="$HOME/.ollama/models"
          mkdir -p "$OLLAMA_MODELS"

          curl -fsSL https://ollama.com/install.sh | sh
          [ $? -eq 0 ] || bail "The Ollama install script failed."
          command -v ollama >/dev/null 2>&1 || bail "No 'ollama' binary on PATH after install."

          sudo systemctl stop ollama >/dev/null 2>&1
          sudo systemctl disable ollama >/dev/null 2>&1

          ollama serve > "$SERVE_LOG" 2>&1 &
          echo "Started 'ollama serve' (pid $!); waiting for the API..."

          DEADLINE=$((SECONDS + 60))
          until curl -sf -m 5 "http://127.0.0.1:11434/api/tags" -o /tmp/ollama-tags.json; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "--- last 50 lines of ollama serve ---"
              tail -n 50 "$SERVE_LOG" 2>/dev/null
              echo "-------------------------------------"
              bail "Ollama did not answer http://localhost:11434/api/tags within 60s."
            fi
            sleep 2
          done
          echo "Ollama API is up after $SECONDS s."

          echo "Pulling $CI_MODEL (a warm cache makes this a no-op)..."
          ollama pull "$CI_MODEL"
          [ $? -eq 0 ] || bail "'ollama pull $CI_MODEL' failed."

          ollama list
          {
            echo "ready=true"
            echo "host=http://127.0.0.1:11434"
            echo "model=$CI_MODEL"
          } >> "$GITHUB_OUTPUT"

      # Always runs, including on the schedule: collapses "detected", "installed
      # by this job" and "none of the above" into one host/model/enabled triple.
      - name: Resolve triage configuration
        id: triage
        env:
          DETECTED: ${{ steps.ollama.outputs.available }}
          DETECTED_HOST: ${{ steps.ollama.outputs.host }}
          INSTALLED: ${{ steps.ollama_setup.outputs.ready }}
          INSTALLED_HOST: ${{ steps.ollama_setup.outputs.host }}
          INSTALLED_MODEL: ${{ steps.ollama_setup.outputs.model }}
          IN_MODEL: ${{ inputs.model }}
          VAR_MODEL: ${{ vars.OLLAMA_MODEL }}
          IN_SKIP_LLM: ${{ inputs.skip_llm }}
        run: |
          if [ "$IN_SKIP_LLM" = "true" ]; then
            ENABLED=false; HOST=""; MODEL=""
            REASON="skip_llm was requested"
          elif [ "$DETECTED" = "true" ]; then
            # Pre-existing Ollama (self-hosted): keep the old behaviour of
            # letting the script auto-discover a model when none is forced.
            ENABLED=true; HOST="$DETECTED_HOST"; MODEL="${IN_MODEL:-$VAR_MODEL}"
            REASON="using the runner's own Ollama at $HOST"
          elif [ "$INSTALLED" = "true" ]; then
            ENABLED=true; HOST="$INSTALLED_HOST"; MODEL="$INSTALLED_MODEL"
            REASON="using the Ollama installed by this job"
          else
            ENABLED=false; HOST=""; MODEL=""
            REASON="no Ollama available on this runner"
          fi
          if [ "$ENABLED" = "true" ]; then
            echo "Triage enabled -- $REASON (model: ${MODEL:-auto-discover})."
          else
            echo "::warning::Candidate triage disabled ($REASON); running liveness + normalise only."
          fi
          {
            echo "enabled=$ENABLED"
            echo "host=$HOST"
            echo "model=$MODEL"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      # Appends newly seen domains to candidates.txt for the triage phase below.
      # Non-fatal by design: an upstream list being down for a day must not cost
      # us the week's liveness refresh.
      - name: Discover new candidates
        id: discover
        if: ${{ inputs.skip_discovery != true }}
        continue-on-error: true
        run: |
          mkdir -p dist
          python3 scripts/discover_candidates.py --report dist/discovery-report.json

      - name: Run maintenance
        id: maintain
        env:
          OLLAMA_HOST: ${{ steps.triage.outputs.host }}
          OLLAMA_MODEL: ${{ steps.triage.outputs.model }}
          OLLAMA_AVAILABLE: ${{ steps.triage.outputs.enabled }}
          # Via env, never interpolated into the script: these are attacker
          # controlled by anyone who can dispatch the workflow.
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_SKIP_CHECK: ${{ inputs.skip_check }}
          IN_LIMIT: ${{ inputs.limit }}
        run: |
          ARGS="--workers 24 --timeout 6"
          [ "$OLLAMA_AVAILABLE" = "true" ] || ARGS="$ARGS --no-ollama"
          [ "$IN_DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          [ "$IN_SKIP_CHECK" = "true" ] && ARGS="$ARGS --no-check"
          if [ -n "$IN_LIMIT" ] && [ "$IN_LIMIT" != "0" ]; then
            case "$IN_LIMIT" in
              ''|*[!0-9]*) echo "::error::limit must be a whole number, got '$IN_LIMIT'"; exit 1 ;;
              *) ARGS="$ARGS --limit $IN_LIMIT" ;;
            esac
          fi
          echo "Running: python scripts/maintain_shorteners.py $ARGS"
          set +e
          python scripts/maintain_shorteners.py $ARGS 2>&1 | tee maintain.log
          STATUS=${PIPESTATUS[0]}
          set -e
          # 3 means the quarantine safety cap tripped: nothing was removed, but
          # a human needs to look. Anything else non-zero is a real failure --
          # note argparse exits 2 for a usage error, which must NOT pass.
          if [ "$STATUS" -eq 3 ]; then
            echo "::warning::Quarantine safety cap tripped; nothing was removed."
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

      - name: Validate data (post-run)
        run: python scripts/validate_data.py

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Check dataset invariants (Node)
        run: |
          npm ci
          npm run ci

      # FIRST: the auto-accepted work goes straight to main. Doing this before
      # the PR step keeps the two from fighting over the working tree -- by the
      # time create-pull-request runs, candidates.review.txt is the only thing
      # left dirty. Note candidates.review.txt is deliberately NOT in this list.
      - name: Commit and push changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/shorteners.json data/redirectors.json data/tracking.json \
                   data/inactive.json shorteners.txt candidates.txt candidates.rejected.txt; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "No dataset changes this week."
          else
            git commit -m "Weekly maintenance: refresh domain liveness ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # THEN: whatever the run could not decide on its own.
      - name: Inspect review queue
        id: review
        if: always()
        run: |
          COUNT=0
          CHANGED=false
          if [ -s candidates.review.txt ]; then
            COUNT=$(grep -cve '^[[:space:]]*$' -e '^[[:space:]]*#' candidates.review.txt || true)
            if [ -n "$(git status --porcelain -- candidates.review.txt)" ]; then
              CHANGED=true
            fi
          fi
          OPEN_PR=false
          if [ "${COUNT:-0}" -gt 0 ] && [ "$CHANGED" = "true" ]; then
            OPEN_PR=true
          fi
          echo "Review queue: ${COUNT:-0} candidate(s), changed=$CHANGED, open_pr=$OPEN_PR"
          {
            echo "count=${COUNT:-0}"
            echo "changed=$CHANGED"
            echo "open_pr=$OPEN_PR"
          } >> "$GITHUB_OUTPUT"

      # Requires "Allow GitHub Actions to create and approve pull requests"
      # (Settings > Actions > General > Workflow permissions). Without it the
      # create call 403s -- continue-on-error keeps the dataset run green when
      # that box is unticked; the queue file simply waits for next week.
      # add-paths scopes the branch to the review file alone, so the dataset
      # files already pushed to main above are never swept into the PR.
      - name: Open review queue pull request
        if: ${{ inputs.dry_run != true && steps.review.outputs.open_pr == 'true' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/review-queue
          add-paths: |
            candidates.review.txt
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          commit-message: "Review queue: candidates needing a human decision"
          title: "Review queue: ${{ steps.review.outputs.count }} candidate domain(s) need a human decision"
          delete-branch: false
          body: |
            The weekly maintenance run could **not** auto-accept the domains in
            `candidates.review.txt`. Each one either got an ambiguous verdict
            from the triage model or lacked enough independent corroboration to
            clear the acceptance bar, so it needs a human to look.

            **To accept a domain:** move its line out of `candidates.review.txt`
            and into `candidates.txt`, then delete it from the review file. The
            next run will ingest it normally and promote it into the dataset.

            **To reject a domain:** add it to `candidates.rejected.txt` and
            delete it from the review file, and it will not come back.

            **To defer:** do nothing. Anything left in `candidates.review.txt`
            is simply re-queued next week and this PR is updated in place.

            This PR is generated and force-updated by
            `.github/workflows/maintain.yml` on the `automation/review-queue`
            branch. Do not hand-edit other files on this branch -- the dataset
            itself is committed straight to `main` by the same run.

      - name: Job summary
        if: always()
        env:
          TRIAGE_ENABLED: ${{ steps.triage.outputs.enabled }}
          TRIAGE_MODEL: ${{ steps.triage.outputs.model }}
          TRIAGE_REASON: ${{ steps.triage.outputs.reason }}
          DISCOVERY_OUTCOME: ${{ steps.discover.outcome }}
          REVIEW_COUNT: ${{ steps.review.outputs.count }}
          REVIEW_PR_OPENED: ${{ steps.review.outputs.open_pr }}
        run: |
          # Every read below is existence-guarded: a summary must never be the
          # thing that fails the weekly run.
          python3 - << 'PY' >> $GITHUB_STEP_SUMMARY
          import json, os

          def load(path):
              try:
                  if os.path.isfile(path) and os.path.getsize(path) > 0:
                      with open(path, encoding="utf-8") as fh:
                          return json.load(fh)
              except Exception as exc:
                  print(f"- :warning: could not read `{path}`: {exc}")
              return {}

          def count_of(d, keys):
              for k in keys:
                  v = d.get(k)
                  if isinstance(v, bool):
                      continue
                  if isinstance(v, int):
                      return v
                  if isinstance(v, (list, dict, str)):
                      return len(v)
              return None

          print("## Weekly maintenance summary")

          r = load("dist/maintenance-report.json")
          disc = load("dist/discovery-report.json")
          lv, ing, nrm = r.get("liveness", {}), r.get("ingest", {}), r.get("normalise", {})

          if r:
              print(f"- **Run**: {r.get('date')} (dry run: {r.get('dry_run')})")

          # --- LLM triage ---
          enabled = os.environ.get("TRIAGE_ENABLED") == "true"
          model = os.environ.get("TRIAGE_MODEL") or ing.get("model") or "auto-discovered"
          reason = os.environ.get("TRIAGE_REASON") or ""
          if enabled:
              print(f"- **LLM triage**: ran with model `{model}`" + (f" ({reason})" if reason else ""))
          else:
              print(f"- **LLM triage**: :warning: skipped -- {reason or 'no Ollama on this runner'}")

          # --- discovery (report schema: scripts/discover_candidates.py) ---
          outcome = os.environ.get("DISCOVERY_OUTCOME") or "skipped"
          if outcome == "skipped":
              print("- **Discovery**: skipped")
          elif disc:
              srcs = disc.get("sources") or []
              ok = sum(1 for s in srcs if s.get("status") == "ok")
              failed = [s.get("name", "?") for s in srcs if s.get("status") != "ok"]
              print(f"- **Discovery**: queued {disc.get('queued', 0)} of "
                    f"{disc.get('total_new', 0)} new domain(s), {disc.get('capped', 0)} held back "
                    f"({ok}/{len(srcs)} sources ok)")
              if failed:
                  print(f"  - :warning: sources unavailable: {', '.join(failed)}")
              hist = disc.get("corroboration_histogram") or {}
              if hist:
                  print("  - corroboration (upstream lists -> domains): "
                        + ", ".join(f"{k}x{v}" for k, v in sorted(hist.items())))
          else:
              note = (" (dist/discovery-report.json is unreadable)"
                      if os.path.isfile("dist/discovery-report.json")
                      else " (no dist/discovery-report.json written)")
              print(f"- **Discovery**: step outcome `{outcome}`{note}")

          # --- liveness / dataset (unchanged) ---
          if lv:
              print(f"- **Checked**: {lv.get('checked', 0)} | alive {lv.get('alive', 0)} "
                    f"| quarantined {lv.get('quarantined', 0)} | needs review {lv.get('review', 0)}")
              if lv.get("quarantine_skipped"):
                  print(f"- :warning: **Safety cap tripped** (> {lv.get('quarantine_cap')} dead). "
                        "Nothing was quarantined -- inspect the report artifact.")
          if r:
              voters = ing.get("models") or []
              panel = (f"{len(voters)}-model consensus ({', '.join(voters)})" if voters
                       else "no triage this run")
              print(f"- **Candidates**: {ing.get('new_candidates', 0)} new "
                    f"| accepted {len(ing.get('accepted', []))} "
                    f"| rejected {len(ing.get('rejected', []))} "
                    f"| review {len(ing.get('review_queue', []))} -- {panel}")
              print(f"- **Dataset**: {nrm.get('shorteners', 0)} shorteners, {nrm.get('redirectors', 0)} redirectors, "
                    f"{nrm.get('tracking', 0)} tracking, {nrm.get('inactive', 0)} inactive")
          else:
              print("- :warning: No `dist/maintenance-report.json` -- the run did not get that far.")

          # --- human review queue ---
          try:
              queued = int(os.environ.get("REVIEW_COUNT") or 0)
          except ValueError:
              queued = 0
          if queued:
              where = ("a pull request on `automation/review-queue`"
                       if os.environ.get("REVIEW_PR_OPENED") == "true"
                       else "`candidates.review.txt` (no PR this run)")
              print(f"- **Awaiting human review**: {queued} candidate(s) in {where}")
          else:
              print("- **Awaiting human review**: none")

          review = [d for d in lv.get("results", []) if d.get("verdict") == "review"]
          if review:
              print("\n<details><summary>Domains needing review</summary>\n")
              print("| Domain | Status | Scheme | Message |")
              print("|--------|--------|--------|---------|")
              for d in sorted(review, key=lambda x: x["domain"])[:100]:
                  msg = str(d.get("message") or "").replace("|", "\\|")[:120]
                  print(f"| `{d['domain']}` | {d['status']} | {d['scheme']} | {msg} |")
              print("\n</details>")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maintenance-report-${{ github.run_id }}
          path: |
            dist/maintenance-report.json
            dist/discovery-report.json
            candidates.review.txt
            maintain.log
          if-no-files-found: ignore
